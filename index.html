<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI QR Split</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; max-width: 480px; width: 100%; margin: 0 auto; padding: 16px; }
  .tagline { font-size: 14px; color: #555; text-align: center; margin-bottom: 16px; }
  input, button { font-size: 16px; padding: 12px; width: 100%; margin-top: 8px; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #upiError { color: #c00; font-size: 13px; min-height: 18px; margin-top: 4px; }
  #qrList { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; justify-content: center; }
  .qrItem { text-align: center; }
  .qrItem img, .qrItem canvas { max-width: 100%; height: auto; }
  #changeUpi { margin-top: 20px; background: none; border: none; color: #666; text-decoration: underline; }
  #shareWhatsapp { margin-top: 12px; background: #25D366; color: #fff; border: none; border-radius: 6px; }
</style>
</head>
<body>

  <div class="tagline">Split Large UPI Payments Into Smaller Payments | Say No to MDR</div>

<div id="setupScreen" style="display:none;">
  <h2>Enter your UPI ID</h2>
  <input id="upiInput" placeholder="yourname@bank" oninput="validateUpi()">
  <div id="upiError"></div>
  <button id="saveBtn" onclick="saveUpi()" disabled>Save</button>
</div>

<div id="mainScreen" style="display:none;">
  <h2>Collect Payment</h2>
  <input id="amountInput" type="number" placeholder="Amount to collect" min="1" inputmode="numeric">
  <button onclick="generateQrs()">Generate QR</button>
  <div id="qrList"></div>
  <button id="shareWhatsapp" onclick="shareOnWhatsapp()">Share on WhatsApp</button>
  <button id="changeUpi" onclick="changeUpi()">Change UPI ID</button>
</div>

<script>
const UPI_KEY = 'upiId';

function init() {
  const upi = localStorage.getItem(UPI_KEY);
  document.getElementById('setupScreen').style.display = upi ? 'none' : 'block';
  document.getElementById('mainScreen').style.display = upi ? 'block' : 'none';
}

const UPI_REGEX = /^[\w.+-]{2,256}@[a-zA-Z]{2,64}$/;

function validateUpi() {
  const upi = document.getElementById('upiInput').value.trim();
  const valid = UPI_REGEX.test(upi);
  document.getElementById('saveBtn').disabled = !valid;
  document.getElementById('upiError').textContent = (upi && !valid) ? 'Invalid UPI ID' : '';
  return valid;
}

function saveUpi() {
  if (!validateUpi()) return;
  const upi = document.getElementById('upiInput').value.trim();
  localStorage.setItem(UPI_KEY, upi);
  init();
}

function changeUpi() {
  localStorage.removeItem(UPI_KEY);
  document.getElementById('upiInput').value = '';
  document.getElementById('upiError').textContent = '';
  document.getElementById('saveBtn').disabled = true;
  init();
}

function shareOnWhatsapp() {
  const url = `https://wa.me/?text=${encodeURIComponent(window.location.href)}`;
  window.open(url, '_blank');
}

// ponytail: uneven last chunk (e.g. 5000 -> 1999,1999,1002), split evenly if that matters later
function splitAmount(total) {
  const chunks = [];
  let remaining = total;
  while (remaining >= 2000) {
    chunks.push(1999);
    remaining -= 1999;
  }
  if (remaining > 0) chunks.push(remaining);
  return chunks;
}

function generateQrs() {
  const amount = Number(document.getElementById('amountInput').value);
  if (!amount || amount <= 0) return alert('Enter a valid amount');

  const upi = localStorage.getItem(UPI_KEY);
  const chunks = splitAmount(amount);

  const list = document.getElementById('qrList');
  list.innerHTML = '';
  chunks.forEach((chunk, i) => {
    const item = document.createElement('div');
    item.className = 'qrItem';
    const qrDiv = document.createElement('div');
    item.appendChild(qrDiv);
    const label = document.createElement('div');
    label.textContent = `₹${chunk}`;
    item.appendChild(label);
    list.appendChild(item);

    const upiUri = `upi://pay?pa=${encodeURIComponent(upi)}&am=${chunk}&cu=INR`;
    new QRCode(qrDiv, { text: upiUri, width: 160, height: 160 });
  });
}

init();
</script>
</body>
</html>
